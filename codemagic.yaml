# =============================================================================
# codemagic.yaml — build de l'app iOS Capacitor (dossier native/) dans le cloud
# Codemagic, puis publication sur TestFlight (App Store Connect).
#
# L'app iOS n'est PAS committée (native/ios/ est gitignoré) : le workflow la
# régénère à chaque build via `cap add ios`.
#
# -----------------------------------------------------------------------------
# À CRÉER CÔTÉ DASHBOARD (ne rien hardcoder ici — voir le RAPPORT fourni) :
#
#   CODEMAGIC → Team settings → Integrations → App Store Connect :
#     • Ajouter une "App Store Connect API key" (Issuer ID + Key ID + fichier .p8).
#     • Lui donner un NOM, puis reporter ce nom dans
#       `integrations.app_store_connect` ci-dessous (remplacer Tutti).
#     • Signature gérée au build par les outils Codemagic via la clé API (rôle
#       Admin, étape 7) : création d'un certificat de distribution + du profil,
#       puis signature. Rien à uploader côté signature.
#
#   APP STORE CONNECT (côté Apple) :
#     • Générer la clé API (Users and Access → Integrations → App Store Connect API),
#       rôle ADMIN (obligatoire : la création d'un certificat de distribution
#       l'exige) → Issuer ID, Key ID, .p8.
#     • Créer l'app (My Apps → +) avec le bundle id ci-dessous (app.tuttiparty).
#
# BUNDLE IDENTIFIER attendu : app.tuttiparty
#   (= appId de native/capacitor.config.ts ; DOIT être identique des deux côtés
#    et enregistré dans App Store Connect. À me confirmer / changer si besoin.)
#
# IMAGE : Xcode 26 (obligatoire pour soumettre sur TestFlight depuis avril 2026).
# =============================================================================

workflows:
  ios-testflight:
    name: Tutti iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90

    # Intégration App Store Connect (créée dans le dashboard Codemagic).
    # Fournit la clé API pour : signature auto, incrément de build, publication.
    integrations:
      app_store_connect: Tutti # ← nom de l'intégration ASC

    environment:
      # Xcode 26 requis. Si "26.0" n'est pas dispo dans les images Codemagic,
      # utiliser "latest" ou la version exacte listée (doit être un Xcode 26.x).
      xcode: 26.0
      node: 20.19.0
      # Groupe de variables Codemagic à charger. La clé privée PERMANENTE
      # `CERTIFICATE_PRIVATE_KEY` (étape 7) DOIT être créée dans un groupe
      # nommé EXACTEMENT `ios_signing` (UI Codemagic → Environment variables,
      # champ "Group" = ios_signing, case "Secure" cochée). Sans cette
      # déclaration, la variable n'est PAS injectée → clé jetable à chaque
      # build → nouveau certificat de distribution à chaque fois → limite
      # Apple (2 max) atteinte → 409 "You already have a current Distribution
      # certificate". Avec la clé permanente chargée : UN SEUL certificat,
      # réutilisé à chaque build.
      groups:
        - ios_signing
        # Variables VITE_* du build frontend (Supabase, backend API/socket…).
        # À créer dans un groupe Codemagic nommé EXACTEMENT `frontend_build`,
        # avec les MÊMES valeurs que sur Vercel (Vercel → projet tutti →
        # Settings → Environment Variables → Production). Sans elles, l'app
        # native affiche une PAGE BLANCHE : `supabase.ts` crée son client à
        # l'import via `createClient(VITE_SUPABASE_URL ?? '', …)` → chaîne vide
        # → "supabaseUrl is required" → le module App plante → rien ne se rend.
        # Vite lit les variables VITE_* du shell au build (étape 3).
        - frontend_build
      vars:
        # Générés par `cap add ios` (Capacitor crée toujours workspace "App").
        XCODE_WORKSPACE: 'native/ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
        PNPM_VERSION: '10.33.2'
        BUNDLE_ID: 'app.tuttiparty'
        APPLE_TEAM_ID: 'N4QYGD595D'

    scripts:
      - name: 1. Activer pnpm (via corepack)
        # Les machines Codemagic (Mac mini M2) ont déjà pnpm/corepack préinstallés.
        # `npm install -g pnpm` échoue donc avec EEXIST (/usr/local/bin/pnpm existe
        # déjà). On active pnpm proprement via corepack, en épinglant la version du
        # dépôt (PNPM_VERSION) pour rester cohérent avec le lockfile --frozen.
        script: |
          corepack enable
          corepack prepare pnpm@$PNPM_VERSION --activate
          pnpm --version

      - name: 2. Deps frontend (workspace pnpm, depuis la racine)
        script: |
          pnpm install --frozen-lockfile

      - name: 3. Build frontend (→ frontend/dist)
        # Garde-fou : sans les VITE_* (groupe frontend_build), l'app native
        # tourne mais affiche une PAGE BLANCHE (client Supabase créé à l'import
        # → "supabaseUrl is required" → App plante avant le render). On échoue
        # ICI, clairement, plutôt que de livrer une app blanche.
        # (On n'affiche JAMAIS les valeurs — juste definie/manquante.)
        script: |
          set -e
          MISSING=""
          for V in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_URL VITE_SOCKET_URL; do
            eval VAL="\${$V:-}"
            if [ -n "$VAL" ]; then
              echo "✅ $V : definie"
            else
              echo "❌ $V : MANQUANTE"
              MISSING="1"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo ""
            echo "Variables VITE_* manquantes → l'app afficherait une page blanche."
            echo "Crée-les dans le groupe Codemagic 'frontend_build' avec les"
            echo "valeurs de Vercel (Settings → Environment Variables → Production)."
            exit 1
          fi
          # VITE_SELECTION_MUSIC_URL est optionnelle (musique d'ambiance) → pas bloquante.
          pnpm -C frontend build

      - name: 4. Deps de native/ (HORS workspace)
        script: |
          cd native
          pnpm install --ignore-workspace

      - name: 5. Capacitor — générer + synchroniser le projet iOS
        # native/ios/ est gitignoré : on l'ajoute s'il n'existe pas, puis on
        # synchronise (copie de frontend/dist + pod install des plugins natifs).
        #
        # Cible de déploiement iOS 15.0 : les plugins natifs (MusicKit
        # ApplicationMusicPlayer) exigent iOS 15+, mais le projet généré par
        # Capacitor cible 13/14 → "required a higher minimum deployment target".
        # On force 15.0 dans le Podfile ET le projet AVANT le pod install de
        # `cap sync`. La 1ʳᵉ pod install de `cap add` échoue sur cette cible
        # (13<15) : on l'ignore (|| true), le patch suivant la corrige.
        script: |
          cd native
          if [ ! -d ios ]; then
            pnpm exec cap add ios || true
          fi
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          pnpm exec cap sync ios
          # Export compliance : Tutti n'utilise que du HTTPS standard (chiffrement
          # EXEMPTÉ). On déclare `ITSAppUsesNonExemptEncryption=false` dans
          # l'Info.plist → chaque build est auto-conforme, plus de blocage
          # TestFlight "Build is missing export compliance" ni de question manuelle.
          # (Add échoue si la clé existe déjà → Set en repli.)
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: 6. Numéro de build unique (requis par TestFlight)
        # $BUILD_NUMBER est fourni et auto-incrémenté par Codemagic à chaque build.
        script: |
          cd native/ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: 7. Signature (certificat + profil) via outils Codemagic
        # Créer un certificat de distribution EXIGE une clé privée fournie par
        # nous (Apple crée le certificat à partir de notre CSR) — d'où l'échec
        # "Cannot create resource without certificate private key".
        #
        # On fournit donc une clé privée à `fetch-signing-files --create`, qui
        # crée le certificat À PARTIR d'elle (donc clé privée disponible) + le
        # provisioning profile. Les outils s'authentifient seuls via l'intégration.
        #
        # RECOMMANDÉ (pérenne) : ajoute une variable Codemagic `CERTIFICATE_PRIVATE_KEY`
        #   contenant UNE clé privée PEM générée une fois
        #   (`openssl genrsa 2048`). Elle sera réutilisée → UN SEUL certificat.
        # Sinon (fallback ci-dessous) on en génère une à la volée → ⚠️ un nouveau
        #   certificat par build (Apple limite à 2 : révoquer un "Apple
        #   Distribution" sur developer.apple.com → Certificates si "maximum
        #   number of certificates generated").
        script: |
          set -e
          keychain initialize

          # Diagnostic (SANS secret) : Issuer ID + Key ID ne sont PAS sensibles.
          # Compare-les avec App Store Connect. Si "<VIDE>" → l'intégration nommée
          # "Tutti" n'est pas chargée (nom/config). Si valeurs correctes mais 401
          # → le .p8 ne correspond pas à ces IDs (re-uploader la bonne clé).
          echo "── Auth App Store Connect fournie par l'intégration ──"
          echo "Issuer ID : ${APP_STORE_CONNECT_ISSUER_ID:-<VIDE>}"
          echo "Key ID    : ${APP_STORE_CONNECT_KEY_IDENTIFIER:-<VIDE>}"
          if [ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "Cle .p8   : presente (non affichee)"
          else
            echo "Cle .p8   : <VIDE>"
          fi
          # Clé privée PERMANENTE (groupe ios_signing). Si <VIDE> → le groupe
          # n'est pas chargé ou la variable manque → cert recréé à chaque build
          # → 409 à la longue. Doit afficher "presente".
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Cle perma : presente (cle reutilisee, non affichee)"
          else
            echo "Cle perma : <VIDE> (cle jetable → nouveau cert a chaque build !)"
          fi
          echo "──────────────────────────────────────────────────────"

          CERT_KEY=/tmp/cert_key.pem
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY"
          else
            openssl genrsa -out "$CERT_KEY" 2048
          fi

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key @file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project "native/ios/App/App.xcodeproj"

      - name: 8. Archive + export .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # Upload sur App Store Connect via l'intégration — SANS soumission auto à la
    # review bêta externe. Le build est uploadé + traité → disponible tout de
    # suite pour les testeurs INTERNES (aucune review Apple requise).
    #
    # Test EXTERNE : à soumettre À LA MAIN quand tu veux (App Store Connect →
    # Tutti → TestFlight → le build → "Soumettre à la vérification").
    #
    # Pourquoi pas `submit_to_testflight: true` : Apple n'autorise qu'UN build
    # en review à la fois par version. Si un build est déjà en review, la
    # soumission auto échoue avec "422: Another build is in review" → build
    # marqué en échec alors que l'upload a réussi. Upload seul = zéro faux échec.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

# -----------------------------------------------------------------------------
# DÉCLENCHEMENT : par défaut, lancement MANUEL (bouton "Start new build" dans
# Codemagic, ou via l'API). Pour builder automatiquement sur push/tag, ajouter
# un bloc `triggering:` (voir doc Codemagic) — laissé manuel volontairement.
# -----------------------------------------------------------------------------
